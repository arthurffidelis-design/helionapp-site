<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Render</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #06080A; }
  #mount { position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
<div id="mount"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="teaser-posters.jsx"></script>
<script type="text/babel">
  let root = ReactDOM.createRoot(document.getElementById('mount'));
  window.show = function (n, fmt) {
    const w = 1080, h = fmt === 'story' ? 1920 : 1080;
    const mount = document.getElementById('mount');
    mount.style.width = w + 'px';
    mount.style.height = h + 'px';
    document.body.style.width = w + 'px';
    document.body.style.height = h + 'px';
    root.render(<div style={{ width: w, height: h }}><TeaserPoster n={n} fmt={fmt} /></div>);
  };
  window.__ready = true;
  window.show(1, 'feed');
</script>
</body>
</html>
